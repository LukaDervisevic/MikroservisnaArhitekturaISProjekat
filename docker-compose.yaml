services:
  mais-db:
    container_name: mais-db
    image: postgres:17.7-alpine
    ports:
      - "5432:5432"
    env_file:
      - ./.env.compose
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mais-backend
    healthcheck:
      test: [ "CMD-SHELL","pg_isready -U $$POSTGRES_USER -d event_service_db && pg_isready -U $$POSTGRES_USER -d lecturer_service_db
      && pg_isready -U $$POSTGRES_USER -d lecture_service_db && pg_isready -U $$POSTGRES_USER -d event_query_service_db 
      && pg_isready -U $$POSTGRES_USER -d lecture_query_service_db" ]
      interval: 5s
      timeout: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.4-management
    container_name: rabbitmq_broker
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - '.env.compose'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_log:/var/log/rabbitmq
      - type: bind
        source: ./rabbitmq/config/rabbitmq.conf
        target: /etc/rabbitmq/rabbitmq.conf
      - type: bind
        source: ./rabbitmq/config/definitions_test.json
        target: /etc/rabbitmq/definitions.json

    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: pass1234
      RABBITMQ_LOAD_DEFINITIONS: "/etc/rabbitmq/definitions.json"
    networks:
      - mais-backend


  apisix:
    image: apache/apisix:${APISIX_IMAGE_TAG:-3.14.1-debian}
    restart: always
    container_name: api_gateway
    volumes:
      - ./api-gateway/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    depends_on:
      etcd:
        condition: service_healthy
    ports:
      - "9180:9180/tcp"  # Admin API
      - "9080:9080/tcp"  # HTTP traffic
      - "9091:9091/tcp"  # Prometheus metrics
      - "9443:9443/tcp"  # HTTPS traffic
      - "9092:9092/tcp"  # Control API
    networks:
      - apisix

  etcd:
    image: bitnamilegacy/etcd:3.5.11
    restart: always
    container_name: "etcd"
    volumes:
      - etcd_data:/bitnami/etcd
    environment:
      ETCD_ENABLE_V2: "true"
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
    healthcheck:
      test: "etcdctl endpoint health"
      interval: 5s
      timeout: 30s
      retries: 5
    ports:
      - "2379:2379/tcp"
    networks:
      - apisix

  lecturer-service:
    container_name: lecturer-service
    build:
      context: ./
      dockerfile: ./lecturer-service/Dockerfile
    depends_on:
      mais-db:
        condition: service_healthy
    ports:
      - "50051:50051"
    env_file:
      - ./lecturer-service/.env.docker
    networks:
      - mais-backend

  event-service:
    container_name: event-service
    build:
      context: ./
      dockerfile: ./event-service/Dockerfile
    depends_on:
      mais-db:
        condition: service_healthy
    ports:
      - "50052:50052"
    env_file:
      - ./event-service/.env.docker
    networks:
      - mais-backend

  event-query-service:
    container_name: event-query-service
    build:
      context: ./
      dockerfile: ./event-query-service/Dockerfile
    depends_on:
      mais-db:
        condition: service_healthy
    ports:
      - "50053:50053"
    env_file:
      - ./event-query-service/.env.docker
    networks:
      - mais-backend

  lecture-service:
    container_name: lecture-service
    build:
      context: ./
      dockerfile: ./lecture-service/Dockerfile
    depends_on:
      mais-db:
        condition: service_healthy
    ports:
      - "50054:50054"
    env_file:
      - ./lecture-service/.env.docker
    networks:
      - mais-backend

  lecture-query-service:
    container_name: lecture-query-service
    build:
      context: ./
      dockerfile: ./lecture-query-service/Dockerfile
    depends_on:
      mais-db:
        condition: service_healthy
    ports:
      - "50055:50055"
    env_file:
      - ./lecture-query-service/.env.docker
    networks:
      - mais-backend



volumes:
  postgres_data:
  rabbitmq_data:
  rabbitmq_log:
  etcd_data:
    driver: local

networks:
  mais-backend:
    driver: bridge
  apisix:
    driver: bridge

