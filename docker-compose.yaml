services:
  mais-db:
    container_name: mais-db
    image: postgres:17.7-alpine
    ports:
      - "5432:5432"
    env_file:
      - ./.env.compose
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mais-backend
    healthcheck:
      test: [ "CMD-SHELL","pg_isready -U $$POSTGRES_USER -d event_service_db && pg_isready -U $$POSTGRES_USER -d lecturer_service_db" ]
      interval: 5s
      timeout: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.4
    container_name: rabbitmq_broker
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - '.env.compose'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_log:/var/log/rabbitmq
    # TODO: add healthcheck

  apisix:
    image: apache/apisix:${APISIX_IMAGE_TAG:-3.14.1-debian}
    restart: always
    container_name: api_gateway
    volumes:
      - ./api-gateway/apisix/config.yml:/usr/local/apisix/conf/config.yml:ro
    depends_on:
      - etcd
    ports:
      - "9180:9180/tcp"  # Admin API
      - "9080:9080/tcp"  # HTTP traffic
      - "9091:9091/tcp"  # Prometheus metrics
      - "9443:9443/tcp"  # HTTPS traffic
      - "9092:9092/tcp"  # Control API

  etcd:
    image: bitnamilegacy/etcd:3.5.11
    restart: always
    volumes:
      - etcd_data:/bitnami/etcd
    environment:
      ETCD_ENABLE_V2: "true"
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"

  event-service:
    container_name: event-service
    build:
      context: ./
      dockerfile: ./event-service/Dockerfile
    depends_on:
      mais-db:
        condition: service_healthy
    ports:
      - "50054:50054"
    env_file:
      - ./event-service/.env.docker
    networks:
      - mais-backend

  lecturer-service:
    container_name: lecturer-service
    build:
      context: ./
      dockerfile: ./lecturer-service/Dockerfile
    depends_on:
      mais-db:
        condition: service_healthy
    ports:
      - "50055:50055"
    env_file:
      - ./lecturer-service/.env.docker
    networks:
      - mais-backend

volumes:
  postgres_data:
  rabbitmq_data:
  rabbitmq_log:
  etcd_data:

networks:
  mais-backend:
    driver: bridge

