syntax = "proto3";

package event;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "proto/location/location.proto";

option go_package = "github.com/LukaDervisevic/MikroservisnaArhitekturaISProjekat/proto/event";

message Event {
    int64 id = 1;
    string name = 2;
    double cotisation_price = 3;  
    string agenda = 4;
    string type = 5;
    google.protobuf.Timestamp date_time = 6;
    location.Location location = 7;
}

message CreateEventRequest {
    string name = 1;
    double cotisation_price = 2;
    string agenda = 3;
    string type = 4;
    google.protobuf.Timestamp date_time = 5;
    int64 location_id = 6;
}

message CreateEventResponse {
    Event event = 1;  
}

message GetEventByIdRequest {
    int64 id = 1;
}

message UpdateEventRequest {
    int64 id = 1;
    string name = 2;
    double cotisation_price = 3;
    string agenda = 4;
    string type = 5;
    google.protobuf.Timestamp date_time = 6;
    int64 location_id = 7;
}

message DeleteEventRequest {
    int64 id = 1;
}

message DeleteEventResponse {
    Event event = 1; 
}


message GetEventByIDResponse {
    Event event = 1;
}


message GetEventByNameRequest {
    string name = 1;
}

message GetEventByNameResponse {
    Event event = 1;
}

message EventWithLocation {
    int64 event_id = 1;
    string event_name = 2;
    double event_cotisation_price = 3;
    string event_agenda = 4;
    string event_type = 5;
    google.protobuf.Timestamp event_date_time = 6;
    int64 location_id = 7;
    string location_name = 8;
    string location_address = 9;
    int64 location_capacity = 10;
}

message GetEventByIdQueryResponse {
    EventWithLocation eventWithLocation = 1;
}

message GetEventByNameQueryResponse {
    EventWithLocation eventWithLocation = 1;
}

message ListEventsRequest {
    int32 page      = 1;
    int32 page_size = 2;
    string type     = 3;
    // Optional
    google.protobuf.Timestamp from_date = 4;
    google.protobuf.Timestamp to_date   = 5;
    int64 location_id = 6;
}

message ListEventsResponse {
    repeated EventWithLocation events = 1;
    int32 total_count     = 2;
    int32 page            = 3;
    int32 page_size       = 4;
    bool has_next_page    = 5;
}

message ListEventsByTypeRequest {
    string type     = 1;
    int32 page      = 2;
    int32 page_size = 3;
}

message ListEventsByTypeResponse {
    repeated  EventWithLocation events = 1;
    int32 total_count     = 2;
    int32 page            = 3;
    int32 page_size       = 4;
    bool has_next_page    = 5;
}

// Event service
service EventService {
    // Creates event
    rpc CreateEvent(CreateEventRequest)   returns (CreateEventResponse) {}
    // Updates existing event
    rpc UpdateEvent(UpdateEventRequest)   returns (google.protobuf.Empty) {}
    // Deletes existing event
    rpc DeleteEvent(DeleteEventRequest)   returns (DeleteEventResponse) {}

    // Get event by id
    rpc GetEventByID(GetEventByIdRequest)       returns (GetEventByIdQueryResponse) {}
    // Get event by name
    rpc GetEventByName(GetEventByNameRequest)   returns (GetEventByNameQueryResponse) {}

    // List events
    rpc ListEvents(ListEventsRequest)               returns (ListEventsResponse) {}
    // List Events by type
    rpc ListEventsByType(ListEventsByTypeRequest)   returns (ListEventsByTypeResponse) {}
}

message SourcedEvent {
    string event_id                       = 1;
    string aggregate_id                   = 2;
    int64 version                         = 3;
    string event_type                     = 4;
    google.protobuf.Timestamp occurred_at = 5;
    string details                        = 6;
}

message CreateSourcedEventRequest {
    string name                           = 1;
    double cotisation_price               = 2;
    string agenda                         = 3;
    string type                           = 4;
    google.protobuf.Timestamp date_time   = 5;
    int64 location_id                     = 6;
}

message SourcedEventMutationResponse {
    string aggregate_id = 1;
    int64 version        = 2;
}

message RenameSourcedEventRequest {
    string aggregate_id = 1;
    string new_name      = 2;
}

message RescheduleSourcedEventRequest {
    string aggregate_id                     = 1;
    google.protobuf.Timestamp new_date_time = 2;
}

message RelocateSourcedEventRequest {
    string aggregate_id     = 1;
    int64 new_location_id   = 2;
}

message ChangeSourcedEventPriceRequest {
    string aggregate_id = 1;
    double new_price     = 2;
}

message CancelSourcedEventRequest {
    string aggregate_id = 1;
    string reason        = 2;
}

message GetSourcedEventStateRequest {
    string aggregate_id = 1;
}

message GetSourcedEventStateResponse {
    string aggregate_id                   = 1;
    int64 version                         = 2;
    string name                           = 3;
    double cotisation_price               = 4;
    string agenda                         = 5;
    string type                           = 6;
    google.protobuf.Timestamp date_time   = 7;
    int64 location_id                     = 8;
    bool cancelled                        = 9;
}

message GetSourcedEventHistoryRequest {
    string aggregate_id = 1;
}

message GetSourcedEventHistoryResponse {
    repeated SourcedEvent events = 1;
}

message CreateSourcedEventSnapshotRequest {
    string aggregate_id = 1;
}

message CreateSourcedEventSnapshotResponse {
    string aggregate_id = 1;
    int64 version        = 2;
}


service EventSourcingService {
    rpc CreateSourcedEvent(CreateSourcedEventRequest)             returns (SourcedEventMutationResponse) {}
    rpc RenameSourcedEvent(RenameSourcedEventRequest)             returns (SourcedEventMutationResponse) {}
    rpc RescheduleSourcedEvent(RescheduleSourcedEventRequest)     returns (SourcedEventMutationResponse) {}
    rpc RelocateSourcedEvent(RelocateSourcedEventRequest)         returns (SourcedEventMutationResponse) {}
    rpc ChangeSourcedEventPrice(ChangeSourcedEventPriceRequest)   returns (SourcedEventMutationResponse) {}
    rpc CancelSourcedEvent(CancelSourcedEventRequest)             returns (SourcedEventMutationResponse) {}

    rpc GetSourcedEventState(GetSourcedEventStateRequest)         returns (GetSourcedEventStateResponse) {}
    rpc GetSourcedEventHistory(GetSourcedEventHistoryRequest)     returns (GetSourcedEventHistoryResponse) {}

    rpc CreateSourcedEventSnapshot(CreateSourcedEventSnapshotRequest) returns (CreateSourcedEventSnapshotResponse) {}
}